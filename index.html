<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Global Variables ---
    // Desktop Sidebar
    const sidebar = document.getElementById('tmSideBar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const textElements = document.querySelectorAll('.sidebar-text');

    // Mobile Menu
    const hamburgerButton = document.getElementById('hamburger-button');
    const mobileMenu = document.getElementById('mobile-menu');
    const closeMobileMenu = document.getElementById('close-mobile-menu');
    const mobileNavLinks = document.querySelectorAll('#mobile-menu a');

    // Navegación interna (flechas atrás/adelante)
    const navBackButton = document.getElementById('nav-back');
    const navForwardButton = document.getElementById('nav-forward');
    let navHistory = [];
    let navIndex = -1;

    // Common variables globales
    const contenido = document.getElementById('contenido');
    let isExpanded = true;

    // --- Dynamic Content Loading ---
    async function cargarContenido(ruta, opciones = {}) {
        const { fromHistory = false } = opciones;
        try {
            const respuesta = await fetch(ruta);
            if (!respuesta.ok) throw new Error('Error al cargar el contenido');

            const contenidoHTML = await respuesta.text();
            document.getElementById('contenido-principal').innerHTML = contenidoHTML;

            contenido.scrollTop = 0;
            window.scrollTo(0, 0);

            const seccion = ruta.split('/').pop().replace('.html', '');
            initializeSection(seccion);

            // Registra la navegación en el historial interno, salvo que
            // venga de un click en las flechas atrás/adelante.
            if (!fromHistory) {
                navHistory = navHistory.slice(0, navIndex + 1);
                navHistory.push(ruta);
                navIndex = navHistory.length - 1;
            }
            actualizarFlechasNav();
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('contenido-principal').innerHTML = `
                <div class="p-4 text-red-500">
                    Error al cargar el contenido: ${error.message}
                </div>
            `;
        }
    }

    function actualizarFlechasNav() {
        if (navBackButton) navBackButton.disabled = navIndex <= 0;
        if (navForwardButton) navForwardButton.disabled = navIndex >= navHistory.length - 1;
    }

    function irAtras() {
        if (navIndex > 0) {
            navIndex--;
            cargarContenido(navHistory[navIndex], { fromHistory: true });
        }
    }

    function irAdelante() {
        if (navIndex < navHistory.length - 1) {
            navIndex++;
            cargarContenido(navHistory[navIndex], { fromHistory: true });
        }
    }

    if (navBackButton) navBackButton.addEventListener('click', irAtras);
    if (navForwardButton) navForwardButton.addEventListener('click', irAdelante);

    // Punto de extensión para inicializar lógica particular de cada sección
    // (portafolio, marketplace, etc.) cuando se cargan dinámicamente.
    function initializeSection(seccion) {
        // Actualmente ninguna sección requiere inicialización extra.
    }

    // --- Mobile Menu Logic ---
    if (hamburgerButton && mobileMenu && closeMobileMenu) {
        hamburgerButton.addEventListener('click', () => {
            mobileMenu.classList.remove('hidden');
        });
        closeMobileMenu.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
        });
        mobileNavLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const ruta = link.getAttribute('data-route');
                if (ruta) {
                    cargarContenido(ruta);
                }
                mobileMenu.classList.add('hidden');
            });
        });
    }

    // --- Desktop Sidebar Logic ---
    function toggleSidebar() {
        if (isExpanded) { // From fullscreen to side-panel
            sidebar.classList.remove('w-screen');
            sidebar.classList.add('w-1/4');

            setTimeout(() => {
                contenido.classList.remove('hidden');
                contenido.style.marginLeft = '25%';
            }, 300);
            sidebarToggle.style.display = 'none';

            // Aumentar texto solo cuando se contrae
            textElements.forEach(element => {
                element.classList.add('text-xl');
            });
        } else { // From side-panel to fullscreen
            sidebar.classList.remove('w-1/4');
            sidebar.classList.add('w-screen');
            contenido.classList.add('hidden');
            contenido.style.marginLeft = '0';
            sidebarToggle.style.display = 'block';

            // Restaurar texto cuando se expande
            textElements.forEach(element => {
                element.classList.remove('text-xl');
            });
        }

        isExpanded = !isExpanded;
    }

    // --- Event Delegation for Navigation ---
    document.addEventListener('click', function(e) {
        // Manejar clicks en enlaces del sidebar y botones de cards
        const routeElement = e.target.closest('[data-route]');

        if (routeElement) {
            e.preventDefault();
            const ruta = routeElement.getAttribute('data-route');

            if (ruta) {
                console.log('Navegando a:', ruta); // Para debugging

                // Mismo comportamiento que el sidebar
                if (isExpanded && window.innerWidth >= 1024) {
                    toggleSidebar();
                }

                cargarContenido(ruta);

                // Scroll al inicio
                contenido.scrollTop = 0;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Manejar el botón de toggle del sidebar
        if (e.target === sidebarToggle || e.target.closest('#sidebarToggle')) {
            e.preventDefault();
            toggleSidebar();
        }
    });

    // --- Initialization ---
    const backgrounds = ['tablero.jpg', 'blue-room.jpg'];
    function setRandomBackground() {
        const randomBg = backgrounds[Math.floor(Math.random() * backgrounds.length)];
        if(sidebar) sidebar.style.backgroundImage = `url('/img/fondos-navbar/${randomBg}')`;
    }

    setRandomBackground();

    // Configuración inicial basada en el viewport
    if(window.innerWidth < 1024){
         // On mobile, the desktop sidebar is hidden via CSS
    } else {
         // On desktop, the sidebar starts fullscreen
         contenido.classList.add('hidden');
    }

    cargarContenido('secciones/inicio.html');
});
</script>
</body>
</html>
